services:
  docs:
    image: node:22-alpine
    working_dir: /site
    volumes:
      - .:/site
      - node_modules:/site/node_modules
    ports:
      - "3000:3000"
    restart: unless-stopped
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --poll 1000"

  build:
    image: node:22-alpine
    working_dir: /site
    profiles: ["tools"]
    volumes:
      - .:/site
      - node_modules:/site/node_modules
    command: sh -c "npm install && npm run build"

  serve:
    image: node:22-alpine
    working_dir: /site
    profiles: ["tools"]
    volumes:
      - .:/site
      - node_modules:/site/node_modules
    ports:
      - "3001:3000"
    command: sh -c "npm run serve -- --host 0.0.0.0"

volumes:
  node_modules:
