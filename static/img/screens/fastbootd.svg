<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800" role="img" aria-label="Fastbootd menu">
  <rect width="480" height="800" fill="#000000"/>
  <g font-family="'Roboto Mono','DejaVu Sans Mono',monospace" fill="#ffffff">
    <text x="240" y="46" font-size="26" font-weight="normal" text-anchor="middle" fill="#ffffff" opacity="0.55">fastbootd</text>
    <text x="20" y="84" font-size="16" font-weight="bold" text-anchor="start" fill="#ffffff">Android Fastboot</text>
    <text x="20" y="110" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">Product name - Kompakt</text>
    <text x="20" y="136" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">Bootloader version - unknown</text>
    <text x="20" y="162" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">Baseband version -</text>
    <text x="20" y="188" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">Serial number - XXXXXXXXXXXXX</text>
    <text x="20" y="214" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">Secure boot - yes</text>
    <text x="20" y="240" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">HW version - 0</text>
    <text x="20" y="266" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">Use volume up/down and power.</text>
    <line x1="14" y1="282" x2="466" y2="282" stroke="#ffffff" stroke-width="2"/>
    <text x="20" y="308" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">Reboot system now</text>
    <text x="20" y="336" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">Enter recovery</text>
    <rect x="14" y="348" width="452" height="24" fill="#ffffff"/>
    <text x="20" y="364" font-size="16" font-weight="normal" text-anchor="start" fill="#000000">Reboot to bootloader</text>
    <text x="20" y="392" font-size="16" font-weight="normal" text-anchor="start" fill="#ffffff">Power off</text>
    <line x1="14" y1="408" x2="466" y2="408" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
