<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800" role="img" aria-label="LineageOS recovery, installing an update">
  <rect width="480" height="800" fill="#ffffff"/>
  <text x="24" y="480" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">Now send the package you want to</text>
  <text x="24" y="504" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">apply</text>
  <text x="24" y="528" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">to the device with "adb sideload</text>
  <text x="24" y="552" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">&lt;filename&gt;"...</text>
  <text x="24" y="576" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">Supported API: 3</text>
  <text x="24" y="600" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">Finding update package...</text>
  <text x="24" y="624" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">Verifying update package...</text>
  <text x="24" y="648" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">Update package verification took</text>
  <text x="24" y="672" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">100.0 s (result 0).</text>
  <text x="24" y="696" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">Installing update...</text>
  <text x="24" y="720" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="start">Step 1/2</text>
  <rect x="22" y="752" width="372" height="14" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="22" y="752" width="149" height="14" fill="#000"/>
  <text x="458" y="766" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="normal" fill="#000" text-anchor="end">40%</text>
</svg>
